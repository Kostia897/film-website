<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3/dist/js.cookie.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body{
            padding-top: 50px;
        }
        .navbar{
            top: 0px;
        }

        .col{
            width: 50%;
        }

        .col-left{
            font-weight: 500;
        }

        .rating-title{
            font-size:28px;
            font-weight:700;
            padding-left: 20px;
            margin-top: 20px;
        }

        .stars{
            display:flex;
            align-items:center;
            padding-left: 20px;
        }

        .star{
            font-size:34px;
            cursor:pointer;
            color:#444;
            transition:0.2s;
        }

        .yellow { color:#ffc20a; }
        .white { color:#ffffff; }
        .selected { color:#4aae4d; }

        .rating-number{
            font-size:40px;
            font-weight:700;
            margin-left:20px;
            color:#4aae4d;
        }

        #description{
            padding-left: 10px;
            word-break: break-all;
            padding-right: 10px;
        }
        .star-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 6px;
        }

        .star-number {
            font-size: 12px;
            margin-top: -5px;
            color: #aaa;
        }
        .comment-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .comment-author {
            font-weight: 600;
            color: #4aae4d;
        }

        .comment-date {
            font-size: 12px;
            color: #888;
        }

        .comment-text {
            margin-top: 8px;
        }

        #commentsList{
            background-color: #444;
            border-radius: 15px;
            padding: 10px;
        }
    </style>
</head>
<body class="vh-100 text-bg-dark">
    <nav class="navbar bg-body-tertiary bg-dark position-fixed w-100" data-bs-theme="dark" style="z-index: 1;">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">LOGO</a>
            <a id="loginOrLeave" href="/login" class="btn btn-outline-light">Log in</a>
        </div>
    </nav>
    <div class="container-fluid d-flex">
            <div style="width: 40%; padding: 30px 20px;">
                <h1 id="title">Title</h1>
                <img id="poster" src="" style="width: 100%">
            </div>
            <div class="container" style="max-width: 400px; margin-top: 40px;">
                <h4>About:</h4>
                <div class="row row-cols-2 row-cols-lg-5 g-2 g-lg-3">
                    <div class="col col-left">
                        <div class="p-1">Year:</div>
                    </div>
                     <div class="col">
                        <div id="year" class="p-1">-</div>
                    </div>

                    <div class="col col-left">
                        <div class="p-1">Country:</div>
                    </div>
                     <div class="col">
                        <div id="country" class="p-1">-</div>
                    </div>

                    <div class="col col-left">
                        <div class="p-1">Genre:</div>
                    </div>
                     <div class="col">
                        <div id="genre" class="p-1">-</div>
                    </div>
                    
                    <div class="col col-left">
                        <div class="p-1">Director:</div>
                    </div>
                     <div class="col">
                        <div id="director" class="p-1">-</div>
                    </div>
                    
                    <div class="col col-left">
                        <div class="p-1">Actors:</div>
                    </div>
                     <div class="col">
                        <div id="actors" class="p-1">-</div>
                    </div>

                    <div class="col col-left">
                        <div class="p-1">Duration:</div>
                    </div>
                     <div class="col">
                        <div id="duration" class="p-1">-</div>
                    </div>
                </div>
                
            </div>
    </div>
    <div class="container-fluid">
        <h5>Description:</h5>
        <p id="description"></p>
    </div>

    <div class="container mt-4">
        <div class="justify-content-center">
            <div class="col-lg-10">
                <video id="player" controls width="100%" style="max-height: 80vh; background: #000;">
                    <source id="videoSource" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>

    <div class="rating-title">Rating</div>

    <div class="d-flex align-items-center">
        <div class="stars" id="stars">
            <div class="star-wrapper">
                <span class="star" data-value="1">★</span>
                <div class="star-number">1</div>
            </div>
            <div class="star-wrapper">
                <span class="star" data-value="2">★</span>
                <div class="star-number">2</div>
            </div>
            <div class="star-wrapper">
                <span class="star" data-value="3">★</span>
                <div class="star-number">3</div>
            </div>
            <div class="star-wrapper">
                <span class="star" data-value="4">★</span>
                <div class="star-number">4</div>
            </div>
            <div class="star-wrapper">
                <span class="star" data-value="5">★</span>
                <div class="star-number">5</div>
            </div>
            <div class="star-wrapper">
                <span class="star" data-value="6">★</span>
                <div class="star-number">6</div>
            </div>
            <div class="star-wrapper">
                <span class="star" data-value="7">★</span>
                <div class="star-number">7</div>
            </div>
            <div class="star-wrapper">
                <span class="star" data-value="8">★</span>
                <div class="star-number">8</div>
            </div>
            <div class="star-wrapper">
                <span class="star" data-value="9">★</span>
                <div class="star-number">9</div>
            </div>
            <div class="star-wrapper">
                <span class="star" data-value="10">★</span>
                <div class="star-number">10</div>
            </div>
        </div>
        <div class="rating-number">
            <span id="ratingNumber"></span>
            <span id="ratingQuantity" style="font-size:18px; color:#ccc;"></span>
        </div>
    </div>

    <div class="container mt-5" style="max-width:800px;">
        <h4 class="mb-4">Comments</h4>

        <div id="commentsList" class="mb-4"></div>
        
        <nav aria-label="Comments pagination">
            <ul id="pagination" class="pagination justify-content-center mt-3"></ul>
        </nav>

        <form id="commentForm">
            <div class="mb-3">
                <textarea 
                    id="commentInput"
                    class="form-control"
                    rows="3"
                    placeholder="Write a comment..."
                    maxlength="1000"
                ></textarea>
            </div>
            <button class="btn btn-success">Send</button>
        </form>
    </div>

    <footer class="container-fluid" style="height: 50px;"></footer>
</div>
</body>
<script src="film.js"></script>
</html>
