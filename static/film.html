<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
.col-left{
    font-weight: 500;
}

.rating-title{
    font-size:28px;
    font-weight:700;
    padding-left: 20px;
    margin-top: 20px;
}

.stars{
    display:flex;
    align-items:center;
    padding-left: 20px;
}

.star{
    font-size:34px;
    cursor:pointer;
    color:#444;
    transition:0.2s;
}

.yellow { color:#ffc20a; }
.white { color:#ffffff; }
.selected { color:#4aae4d; }

.rating-number{
    font-size:40px;
    font-weight:700;
    margin-left:20px;
    color:#4aae4d;
}

#description{
    padding-left: 10px;
    word-break: break-all;
    padding-right: 10px;
}
    </style>
</head>
<body class="vh-100 text-bg-dark">
    <nav class="navbar bg-body-tertiary bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">LOGO</a>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <a href="/login"><button type="button" class="btn btn-outline-light">Log in</button></a>
        </div>
    </nav>
    <div class="container-fluid d-flex">
            <div style="width: 40%; padding: 30px 20px;">
                <h1 id="title">Title</h1>
                <img id="poster" src="" style="width: 100%">
            </div>
            <div class="container" style="max-width: 400px; margin-top: 40px;">
                <h4>About:</h4>
                <div class="row row-cols-2 row-cols-lg-5 g-2 g-lg-3">
                    <div class="col col-left">
                        <div class="p-1">Year:</div>
                    </div>
                     <div class="col">
                        <div id="year" class="p-1">-</div>
                    </div>

                    <div class="col col-left">
                        <div class="p-1">Country:</div>
                    </div>
                     <div class="col">
                        <div id="country" class="p-1">-</div>
                    </div>

                    <div class="col col-left">
                        <div class="p-1">Genre:</div>
                    </div>
                     <div class="col">
                        <div id="genre" class="p-1">-</div>
                    </div>
                    
                    <div class="col col-left">
                        <div class="p-1">Director:</div>
                    </div>
                     <div class="col">
                        <div id="director" class="p-1">-</div>
                    </div>
                    
                    <div class="col col-left">
                        <div class="p-1">Actors:</div>
                    </div>
                     <div class="col">
                        <div id="actors" class="p-1">-</div>
                    </div>

                    <div class="col col-left">
                        <div class="p-1">Duration:</div>
                    </div>
                     <div class="col">
                        <div id="duration" class="p-1">-</div>
                    </div>
                </div>
                
            </div>
    </div>
    <div class="container-fluid">
        <h5>Description:</h5>
        <p id="description"></p>
    </div>
    <div class="rating-title">Rating</div>

    <div class="d-flex align-items-center">
        <div class="stars" id="stars">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
            <span class="star" data-value="6">★</span>
            <span class="star" data-value="7">★</span>
            <span class="star" data-value="8">★</span>
            <span class="star" data-value="9">★</span>
            <span class="star" data-value="10">★</span>
        </div>

    <div class="rating-number" id="ratingNumber"></div>
</div>
</body>
<script src="film.js"></script>
</html>
