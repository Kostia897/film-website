<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3/dist/js.cookie.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body{
            padding-top: 50px;
        }
        nav{
            top: 0px;
        }
        #filmsList{
            gap: 20px;
            padding: 30px;
        }
        .film{
            background-color: rgb(56, 56, 56);
            width: 200px;
            min-height: 300px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        .film:hover{
            cursor: pointer;
        }
        .poster{
            width: 200px;
        }
    </style>
</head>
<body class="vh-100 text-bg-dark">
    <nav class="navbar bg-body-tertiary bg-dark position-fixed w-100" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">LOGO</a>
            <div class="d-flex gap-2">
                <form id="searchForm" class="d-flex" role="search">
                    <input id="searchInput" class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                <div class="dropdown">
                    <a class="btn btn-secondary dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Filters
                    </a>
                    <form id="filterSearchForm" class="dropdown-menu p-2">
                        <div class="mb-2">
                            <label class="form-label">Year</label>
                            <input id="inputYear" type="number" class="form-control" placeholder="Any">
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="mb-2">
                            <label class="form-label">Country</label>
                            <input id="inputCountry" type="text" class="form-control" placeholder="Any">
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="mb-2">
                            <label class="form-label">Min rating</label>
                            <select class="form-select" id="min-rating">
                                <option value="">Any</option>
                                <option value="9">9+</option>
                                <option value="8">8+</option>
                                <option value="7">7+</option>
                                <option value="6">6+</option>
                                <option value="5">5+</option>
                                <option value="4">4+</option>
                                <option value="3">3+</option>
                                <option value="2">2+</option>
                                <option value="1">1+</option>
                            </select>
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="mb-3">
                            <label class="form-label">Duration (minutes)</label>
                            <input type="number" class="form-control mb-1" id="durationFrom" placeholder="From">
                            <input type="number" class="form-control" id="durationTo" placeholder="To">
                        </div>
                        <div class="mb-3">
                            <button class="btn btn-outline-success w-100" type="submit">Search</button>
                        </div>
                    </form>
                </div>
            </div>    
            <div class="d-flex gap-2">
                <a id="addFilmBtn" href="/addfilm" class="btn btn-outline-warning" style="display: none;">Add film</a>
                <a id="loginOrLeave" href="/login" class="btn btn-outline-light">Log in</a>
            </div>
        </div>
    </nav>
    <div id="filmsList" class="container-fluid d-flex justify-content-center flex-wrap"></div>
    <nav aria-label="Comments pagination">
        <ul id="pagination" class="pagination justify-content-center mt-3"></ul>
    </nav>
</body>
<script src="index.js"></script>
</html>
