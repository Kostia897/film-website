<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Add Film</h2>

<form id="filmForm">
    <input type="text" id="title" placeholder="Title" required><br><br>
    <textarea id="description" placeholder="Description" required></textarea><br><br>
    <input type="number" id="year" placeholder="Year" required><br><br>
    <input type="number" id="duration" placeholder="Duration (minutes)" required><br><br>
    <input type="text" id="country" placeholder="Country" required><br><br>
    <input type="text" id="actors" placeholder="Actors" required><br><br>
    <input type="text" id="directors" placeholder="Directors" required><br><br>
    <select id="genres" multiple size="5"></select><br><br>

    <label for="poster">Poster Image:</label>
    <input type="file" id="poster" accept="image/*" required><br><br>

    <label for="poster">Poster Image:</label>
    <input type="file" id="video" accept="video/mp4" required><br><br>

    <button type="submit">Add Film</button>
</form>

<p id="status"></p>

</body>
<script src="addfilm.js"></script>
</html>
